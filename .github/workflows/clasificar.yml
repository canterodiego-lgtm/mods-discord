name: Clasificar un mod

on:
  workflow_dispatch:
    inputs:
      mod:
        description: "ID del mod (16 letras/numeros, esta en el aviso de #admin-mods). Podes poner varios separados por coma"
        required: true
        type: string
      categoria:
        description: "Categoria correcta"
        required: true
        type: choice
        options:
          - "⚙️ Servidor, optimización y estadísticas"
          - "🎮 Game Master"
          - "🏴 Comunidad COC"
          - "🌍 Mundo y misiones"
          - "💥 Combate y efectos"
          - "🔊 Audio y voces"
          - "🚗 Vehículos terrestres y navales"
          - "✈️ Aeronaves"
          - "📦 Logística y apoyo"
          - "🧍 Movimiento e interacción"
          - "🩺 ACE (médico y captura)"
          - "🪖 Facciones, IA y personajes"
          - "🎒 Equipo y loadouts"
          - "🔫 Armas y ópticas"
          - "🧩 Librerías base (dependencias)"
      descripcion:
        description: "Descripcion en espanol (opcional; si la dejas vacia se usa la de la Workshop)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: publicar-mods
  cancel-in-progress: false

jobs:
  clasificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar requests
        run: pip install requests

      - name: Clasificar el mod
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          PANEL_SERVER: ${{ secrets.PANEL_SERVER }}
          PANEL_API_KEY: ${{ secrets.PANEL_API_KEY }}
          PANEL_FILE: /config.json
          MOD_ID: ${{ github.event.inputs.mod }}
          CATEGORIA: ${{ github.event.inputs.categoria }}
          DESCRIPCION: ${{ github.event.inputs.descripcion }}
        run: python clasificar_mod.py

      - name: Republicar la lista en Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_ADMIN_WEBHOOK: ${{ secrets.DISCORD_ADMIN_WEBHOOK }}
          PANEL_URL: ${{ secrets.PANEL_URL }}
          PANEL_SERVER: ${{ secrets.PANEL_SERVER }}
          PANEL_API_KEY: ${{ secrets.PANEL_API_KEY }}
          PANEL_FILE: /config.json
        run: python publicar_mods.py --force

      - name: Guardar cambios
        if: always()
        run: |
          git config user.name "mods-bot"
          git config user.email "mods-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Clasificar mod"
            git pull --rebase
            git push
          fi
